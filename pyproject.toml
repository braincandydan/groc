[project]
name = "groc"
version = "0.1.0"
description = "Grocery deal scraper and chat assistant built on Flipp's flyer API"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "anthropic",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]
prod = [
    "gunicorn>=22.0",
]

[project.scripts]
groc = "groc.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["groc*"]

[tool.setuptools.package-data]
groc = ["templates/*.html"]
