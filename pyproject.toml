[project]
name = "groc"
version = "0.1.0"
description = "Grocery deal scraper and chat assistant built on Flipp's flyer API"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "anthropic",
    "flask>=3.0",
    # Unconditional (not an optional extra) because Vercel installs from
    # pyproject.toml's main dependency list, ignoring requirements.txt when
    # both exist -- an optional 'postgres' extra here was silently never
    # installed on Vercel, causing "ModuleNotFoundError: No module named
    # 'psycopg'" in production despite requirements.txt listing it correctly.
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]
prod = [
    "gunicorn>=22.0",
]

[project.scripts]
groc = "groc.cli:main"

[tool.vercel]
entrypoint = "groc.wsgi:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["groc*"]

[tool.setuptools.package-data]
groc = ["templates/*.html"]
