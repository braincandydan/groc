<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>groc</title>
</head>
<body>
<h1>groc</h1>

<h2>Search</h2>
<form id="load-form">
  <label>Postal code: <input id="postal-code" type="text" placeholder="e.g. M5V2H1"></label>
  <button type="submit">Search</button>
</form>
<p>
  <input id="filter-query" type="text" placeholder="filter results, e.g. chicken breast" disabled>
  <label><input id="best-per-merchant" type="checkbox" disabled> cheapest per store only</label>
</p>
<p id="search-status"></p>
<table id="search-results" border="1" cellpadding="4">
  <thead>
    <tr><th>Store</th><th>Image</th><th>Item</th><th>Category</th><th>Was</th><th>Price</th><th>Saved</th><th>Valid to</th></tr>
  </thead>
  <tbody></tbody>
</table>

<h2>Ask</h2>
<form id="ask-form">
  <input id="ask-question" type="text" placeholder="e.g. what's the best deal on chicken breast" size="60">
  <button type="submit">Ask</button>
</form>
<p id="ask-answer"></p>
<table id="ask-sources" border="1" cellpadding="4">
  <thead>
    <tr><th>Store</th><th>Image</th><th>Item</th><th>Category</th><th>Was</th><th>Price</th><th>Saved</th><th>Valid to</th></tr>
  </thead>
  <tbody></tbody>
</table>

<script>
console.log('[groc] script loaded');

let allResults = [];

function renderRows(tbodyId, rows) {
  console.log('[groc] renderRows', tbodyId, rows.length, 'rows');
  const tbody = document.querySelector('#' + tbodyId + ' tbody');
  tbody.innerHTML = '';
  for (const row of rows) {
    const price = row.unit_price != null ? row.unit_price : row.price;
    const priceText = price != null ? '$' + Number(price).toFixed(2) : 'n/a';
    const wasText = row.was_price != null ? '$' + Number(row.was_price).toFixed(2) : '';
    let savedText = '';
    if (row.was_price != null && price != null && row.was_price > price) {
      savedText = '$' + (row.was_price - price).toFixed(2);
    }

    const tr = document.createElement('tr');
    tr.innerHTML = '<td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td>';
    tr.children[0].textContent = row.merchant;

    if (row.cutout_image_url) {
      const img = document.createElement('img');
      img.src = row.cutout_image_url;
      img.alt = row.item_name;
      img.style.height = '50px';
      tr.children[1].appendChild(img);
    }

    tr.children[2].textContent = row.item_name;
    tr.children[3].textContent = row.category || '';
    tr.children[4].textContent = wasText;
    tr.children[5].textContent = priceText;
    tr.children[6].textContent = savedText;
    tr.children[7].textContent = row.valid_to || '';
    tbody.appendChild(tr);
  }
}

function applyFilterAndRender() {
  const terms = document.getElementById('filter-query').value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  console.log('[groc] applyFilterAndRender terms=', terms, 'allResults.length=', allResults.length);
  let rows = allResults;
  if (terms.length) {
    rows = rows.filter(row => terms.every(t => row.item_name.toLowerCase().includes(t)));
  }
  if (document.getElementById('best-per-merchant').checked) {
    const seen = new Set();
    rows = rows.filter(row => {
      if (seen.has(row.merchant)) return false;
      seen.add(row.merchant);
      return true;
    });
  }
  console.log('[groc] filtered down to', rows.length, 'rows');
  renderRows('search-results', rows);
}

const loadForm = document.getElementById('load-form');
console.log('[groc] load-form element:', loadForm);

loadForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  console.log('[groc] load-form submit fired');
  const postalCode = document.getElementById('postal-code').value.trim();
  console.log('[groc] postalCode =', JSON.stringify(postalCode));
  if (!postalCode) {
    console.log('[groc] no postal code entered, aborting');
    return;
  }

  const statusEl = document.getElementById('search-status');
  const PAGE_SIZE = 500;
  const MAX_PAGES = 50; // safety cap: 25,000 rows, well beyond any real postal code

  allResults = [];
  document.getElementById('filter-query').disabled = true;
  document.getElementById('best-per-merchant').disabled = true;

  try {
    let offset = 0;
    for (let page = 0; page < MAX_PAGES; page++) {
      statusEl.textContent = 'Loading... (' + allResults.length + ' items so far)';
      const params = new URLSearchParams({ postal_code: postalCode, limit: PAGE_SIZE, offset });
      const url = '/api/search?' + params.toString();
      console.log('[groc] fetching page', page, url);

      const res = await fetch(url);
      const data = await res.json();
      console.log('[groc] page', page, 'response status', res.status, 'json', data);

      if (!res.ok) {
        statusEl.textContent = 'Error: ' + (data.error || res.status);
        console.error('[groc] search request failed', data);
        return;
      }

      const pageResults = data.results || [];
      allResults = allResults.concat(pageResults);
      if (!data.has_more) break;
      offset += PAGE_SIZE;
    }

    console.log('[groc] allResults set, length =', allResults.length);

    document.getElementById('filter-query').disabled = false;
    document.getElementById('best-per-merchant').disabled = false;
    statusEl.textContent = allResults.length + ' items loaded for ' + postalCode + '. Type below to filter.';
    applyFilterAndRender();
  } catch (err) {
    console.error('[groc] fetch threw', err);
    statusEl.textContent = 'Error: ' + err;
  }
});

document.getElementById('filter-query').addEventListener('input', applyFilterAndRender);
document.getElementById('best-per-merchant').addEventListener('change', applyFilterAndRender);

document.getElementById('ask-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  console.log('[groc] ask-form submit fired');
  const question = document.getElementById('ask-question').value.trim();
  if (!question) return;
  document.getElementById('ask-answer').textContent = 'Thinking...';
  try {
    const res = await fetch('/api/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        question,
        postal_code: document.getElementById('postal-code').value.trim() || null,
      }),
    });
    console.log('[groc] ask response status', res.status);
    const data = await res.json();
    console.log('[groc] ask response json', data);
    document.getElementById('ask-answer').textContent = data.answer || data.error || '';
    renderRows('ask-sources', data.sources || []);
  } catch (err) {
    console.error('[groc] ask fetch threw', err);
    document.getElementById('ask-answer').textContent = 'Error: ' + err;
  }
});
</script>
</body>
</html>
